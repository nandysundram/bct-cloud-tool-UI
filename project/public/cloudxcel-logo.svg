<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#circleGrad)" stroke="#2d2d44" stroke-width="3"/>
  <!-- CloudXcel text -->
  <text x="100" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="0.5">
    <tspan fill="white">Cloud</tspan><tspan fill="#3B82F6">X</tspan><tspan fill="white">cel</tspan>
  </text>
  <!-- .Ai text -->
  <text x="100" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="1">
    <tspan fill="#3B82F6">.</tspan><tspan fill="white">A</tspan><tspan fill="#3B82F6">i</tspan>
  </text>
</svg>
